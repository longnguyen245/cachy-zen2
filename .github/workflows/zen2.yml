name: Build CachyOS Zen2 EEVDF Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "CachyOS/linux branch or tag to build (e.g. cachyos-7.1.8-1)"
        required: false
        default: ""
      compiler:
        description: "Which compiler variant(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - clang
          - gcc
  push:
    branches:
      - master
    tags:
      - "cachyos-*"

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/CachyOS/linux.git
  KERNEL_REF_DEFAULT: master
  CONFIG_URL: https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-eevdf/config
  LLVM_VERSION: "23.1.2"
  LLVM_DIR: "/opt/llvm"

jobs:

  build:
    name: Build kernel (${{ matrix.compiler }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            suffix: "-cachyos-zen2-eevdf"
            pkg_name: linux-cachyos-zen2-eevdf
            make_args: "LLVM=1"
          - compiler: gcc
            suffix: "-cachyos-zen2-eevdf-gcc"
            pkg_name: linux-cachyos-zen2-eevdf-gcc
            make_args: ""

    env:
      COMPILER: ${{ matrix.compiler }}
      KERNEL_SUFFIX: ${{ matrix.suffix }}
      PKG_NAME: ${{ matrix.pkg_name }}
      MAKE_ARGS: ${{ matrix.make_args }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check variant is selected
        id: select
        env:
          INPUT_COMPILER: ${{ inputs.compiler }}
        run: bash scripts/common/select-variant.sh

      - name: Resolve kernel ref
        if: steps.select.outputs.run == 'true'
        env:
          INPUT_REF: ${{ inputs.kernel_ref }}
        run: bash scripts/build/resolve-ref.sh

      - name: Free disk space
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/free-disk-space.sh

      - name: Install build dependencies
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/install-deps.sh

      # ---------------------------------------------------------------- GCC
      - name: Show GCC version
        if: steps.select.outputs.run == 'true' && matrix.compiler == 'gcc'
        run: |
          gcc --version
          ld --version | head -n1

      # -------------------------------------------------------------- Clang
      - name: Install LLVM
        if: steps.select.outputs.run == 'true' && matrix.compiler == 'clang'
        run: bash scripts/build/install-llvm.sh

      - name: Install Rust
        if: steps.select.outputs.run == 'true' && matrix.compiler == 'clang'
        run: bash scripts/build/install-rust.sh

      - name: Install bindgen
        if: steps.select.outputs.run == 'true' && matrix.compiler == 'clang'
        run: bash scripts/build/install-bindgen.sh

      # ------------------------------------------------------------- Common
      - name: Checkout kernel
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/checkout-kernel.sh kernel

      - name: Fetch CachyOS EEVDF config
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/fetch-config.sh kernel

      - name: Configure kernel
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/configure-kernel.sh kernel

      - name: Build kernel
        if: steps.select.outputs.run == 'true'
        env:
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-actions
        run: bash scripts/build/build-kernel.sh kernel

      - name: Prepare kernel artifacts
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/prepare-artifacts.sh kernel

      - name: Prepare kernel headers
        if: steps.select.outputs.run == 'true'
        run: bash scripts/build/prepare-headers.sh kernel

      - name: Upload kernel build
        if: steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.compiler }}
          path: |
            kernel/kernel-root.tar.zst
            kernel/headers-root.tar.zst
          compression-level: 0

  arch:
    name: Arch Linux package (${{ matrix.compiler }})
    needs:
      - build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            pkg_name: linux-cachyos-zen2-eevdf
          - compiler: gcc
            pkg_name: linux-cachyos-zen2-eevdf-gcc

    container:
      image: archlinux:latest

    env:
      COMPILER: ${{ matrix.compiler }}
      PKG_NAME: ${{ matrix.pkg_name }}

    steps:
      - name: Install git for checkout
        run: pacman -S --noconfirm --needed git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check variant is selected
        id: select
        env:
          INPUT_COMPILER: ${{ inputs.compiler }}
        run: bash scripts/common/select-variant.sh

      - name: Install packaging dependencies
        if: steps.select.outputs.run == 'true'
        run: bash scripts/arch/install-deps.sh

      - name: Download kernel build
        if: steps.select.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.compiler }}
          path: build

      - name: Create Arch package
        if: steps.select.outputs.run == 'true'
        run: bash scripts/arch/create-package.sh build

      - name: Upload Arch package
        if: steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arch-zen2-eevdf-${{ matrix.compiler }}
          path: artifacts/*.pkg.tar.zst

  deb:
    name: Ubuntu/Debian package (${{ matrix.compiler }})
    needs:
      - build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            pkg_name: linux-cachyos-zen2-eevdf
          - compiler: gcc
            pkg_name: linux-cachyos-zen2-eevdf-gcc

    env:
      COMPILER: ${{ matrix.compiler }}
      PKG_NAME: ${{ matrix.pkg_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check variant is selected
        id: select
        env:
          INPUT_COMPILER: ${{ inputs.compiler }}
        run: bash scripts/common/select-variant.sh

      - name: Install packaging dependencies
        if: steps.select.outputs.run == 'true'
        run: bash scripts/deb/install-deps.sh

      - name: Download kernel build
        if: steps.select.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.compiler }}
          path: build

      - name: Create Debian package
        if: steps.select.outputs.run == 'true'
        run: bash scripts/deb/create-package.sh build

      - name: Upload Debian package
        if: steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb-zen2-eevdf-${{ matrix.compiler }}
          path: artifacts/*.deb

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/cachyos-')
    needs:
      - arch
      - deb

    runs-on: ubuntu-24.04

    steps:
      - name: Download Arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-arch-zen2-eevdf-*
          merge-multiple: true
          path: release

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-deb-zen2-eevdf-*
          merge-multiple: true
          path: release

      - name: List release files
        run: find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.pkg.tar.zst
            release/*.deb
