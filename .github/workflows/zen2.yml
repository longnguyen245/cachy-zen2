name: Build CachyOS Zen2 EEVDF Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "CachyOS/linux branch or tag to build (e.g. cachyos-7.1.8-1)"
        required: false
        default: ""
      compiler:
        description: "Which compiler variant(s) to build"
        required: false
        default: "both"
        type: choice
        options: [both, clang, gcc]
  push:
    branches: [master]
    tags: ["cachyos-*"]

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/CachyOS/linux.git
  KERNEL_REF_DEFAULT: master
  CONFIG_URL: https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-eevdf/config
  LLVM_VERSION: "23.1.2"
  LLVM_DIR: "/opt/llvm"

# Only the selected variant(s) run; skipped matrix entries are free.
jobs:
  build:
    name: Build kernel (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.compiler == 'both' || inputs.compiler == matrix.compiler
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        include:
          - compiler: clang
            suffix: "-cachyos-zen2-eevdf"
            pkg_name: linux-cachyos-zen2-eevdf
            make_args: "LLVM=1"
          - compiler: gcc
            suffix: "-cachyos-zen2-eevdf-gcc"
            pkg_name: linux-cachyos-zen2-eevdf-gcc
            make_args: ""
    env:
      COMPILER: ${{ matrix.compiler }}
      KERNEL_SUFFIX: ${{ matrix.suffix }}
      PKG_NAME: ${{ matrix.pkg_name }}
      MAKE_ARGS: ${{ matrix.make_args }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment
        run: bash .github/scripts/setup.sh

      - name: Fetch kernel source
        env:
          INPUT_REF: ${{ inputs.kernel_ref }}
        run: bash .github/scripts/fetch.sh

      - name: Configure kernel
        run: bash .github/scripts/configure.sh

      - name: Build kernel
        run: bash .github/scripts/build.sh

      - name: Package kernel and headers
        run: bash .github/scripts/package.sh

      - name: Upload kernel build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: |
            kernel/kernel-root.tar.zst
            kernel/headers-root.tar.zst
          compression-level: 0

  arch:
    name: Arch Linux package (${{ matrix.compiler }})
    needs: [build]
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    if: github.event_name != 'workflow_dispatch' || inputs.compiler == 'both' || inputs.compiler == matrix.compiler
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        include:
          - compiler: clang
            pkg_name: linux-cachyos-zen2-eevdf
          - compiler: gcc
            pkg_name: linux-cachyos-zen2-eevdf-gcc
    env:
      COMPILER: ${{ matrix.compiler }}
      PKG_NAME: ${{ matrix.pkg_name }}
    steps:
      - name: Install packaging dependencies
        run: sudo pacman -S --noconfirm --needed base-devel git zstd
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build
      - name: Create Arch package
        run: bash .github/scripts/pack-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.compiler }}
          path: artifacts/*.pkg.tar.zst

  deb:
    name: Ubuntu/Debian package (${{ matrix.compiler }})
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.compiler == 'both' || inputs.compiler == matrix.compiler
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        include:
          - compiler: clang
            pkg_name: linux-cachyos-zen2-eevdf
          - compiler: gcc
            pkg_name: linux-cachyos-zen2-eevdf-gcc
    env:
      COMPILER: ${{ matrix.compiler }}
      PKG_NAME: ${{ matrix.pkg_name }}
    steps:
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev zstd
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build
      - name: Create Debian package
        run: bash .github/scripts/pack-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.compiler }}
          path: artifacts/*.deb

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/cachyos-')
    needs: [arch, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-*,deb-*
          merge-multiple: true
          path: release
      - name: List release files
        run: find release -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.pkg.tar.zst
            release/*.deb