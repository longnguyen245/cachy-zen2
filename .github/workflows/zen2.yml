name: Build CachyOS EEVDF Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "CachyOS/linux branch or tag to build (e.g. 7.1/cachy)"
        required: false
        default: ""
      variant:
        description: "Which target variant(s) to build"
        required: false
        default: "both"
        type: choice
        options: [both, amd, generic]
  push:
    branches: [master]
    tags: ["cachyos-*"]

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/CachyOS/linux.git
  KERNEL_REF_DEFAULT: 7.1/cachy
  CONFIG_URL: https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-eevdf/config

jobs:
  # The variant list is computed here because a job-level 'if' cannot see the
  # matrix context; the dispatch input is only available on workflow_dispatch.
  select:
    name: Select variants
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.pick.outputs.variants }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.variant }}
        run: |
          if [ "${EVENT}" != workflow_dispatch ] || [ -z "${WANT}" ] || [ "${WANT}" = both ]; then
            variants='["amd","generic"]'
          else
            variants="[\"${WANT}\"]"
          fi
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"
          echo "Building variants: ${variants}"

  build:
    name: Build kernel (${{ matrix.variant }})
    needs: [select]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.select.outputs.variants) }}
        include:
          - variant: amd
            suffix: "-cachyos-zen2-eevdf-gcc"
            pkg_name: linux-cachyos-zen2-eevdf-gcc
            target_desc: "AMD Zen 2"
          - variant: generic
            suffix: "-cachyos-eevdf-gcc"
            pkg_name: linux-cachyos-eevdf-gcc
            target_desc: "generic x86-64"
    env:
      VARIANT: ${{ matrix.variant }}
      KERNEL_SUFFIX: ${{ matrix.suffix }}
      PKG_NAME: ${{ matrix.pkg_name }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment
        run: bash .github/scripts/setup.sh

      - name: Fetch kernel source
        env:
          INPUT_REF: ${{ inputs.kernel_ref }}
        run: bash .github/scripts/fetch.sh

      - name: Configure kernel
        run: bash .github/scripts/configure.sh

      - name: Build kernel
        run: bash .github/scripts/build.sh

      - name: Package kernel and headers
        run: bash .github/scripts/package.sh

      - name: Upload kernel build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            kernel/kernel-root.tar.zst
            kernel/headers-root.tar.zst
          compression-level: 0

  arch:
    name: Arch Linux package (${{ matrix.variant }})
    needs: [select, build]
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.select.outputs.variants) }}
        include:
          - variant: amd
            pkg_name: linux-cachyos-zen2-eevdf-gcc
            target_desc: "AMD Zen 2"
          - variant: generic
            pkg_name: linux-cachyos-eevdf-gcc
            target_desc: "generic x86-64"
    env:
      VARIANT: ${{ matrix.variant }}
      PKG_NAME: ${{ matrix.pkg_name }}
      TARGET_DESC: ${{ matrix.target_desc }}
    steps:
      - name: Install packaging dependencies
        run: pacman -Syu --noconfirm --needed base-devel git zstd
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: build
      - name: Create Arch package
        run: bash .github/scripts/pack-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.variant }}
          path: artifacts/*.pkg.tar.zst

  deb:
    name: Ubuntu/Debian package (${{ matrix.variant }})
    needs: [select, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.select.outputs.variants) }}
        include:
          - variant: amd
            pkg_name: linux-cachyos-zen2-eevdf-gcc
            target_desc: "AMD Zen 2"
          - variant: generic
            pkg_name: linux-cachyos-eevdf-gcc
            target_desc: "generic x86-64"
    env:
      VARIANT: ${{ matrix.variant }}
      PKG_NAME: ${{ matrix.pkg_name }}
      TARGET_DESC: ${{ matrix.target_desc }}
    steps:
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev zstd
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: build
      - name: Create Debian package
        run: bash .github/scripts/pack-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.variant }}
          path: artifacts/*.deb

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/cachyos-')
    needs: [arch, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-*,deb-*
          merge-multiple: true
          path: release
      - name: List release files
        run: find release -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.pkg.tar.zst
            release/*.deb
